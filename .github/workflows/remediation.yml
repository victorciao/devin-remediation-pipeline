name: Remediation

on:
  repository_dispatch:
    types: [codeql-scan-completed]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      only_lanes:
        description: Optional lane restriction; empty means enumerate all three lanes
        required: false
        default: ""
      budget_n:
        description: High-tier dispatch budget
        required: false
        default: "1"
      max_sessions:
        description: Session ceiling
        required: false
        default: "1"
      tier_high_min:
        description: High-tier score threshold
        required: false
        default: ""

concurrency:
  group: remediation-pipeline
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
      GITHUB_PAT_REMEDIATION: ${{ secrets.REMEDIATION_GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout Superset target
        uses: actions/checkout@v4
        with:
          repository: victorciao/superset
          path: superset-target
          token: ${{ secrets.REMEDIATION_GITHUB_PAT }}
          fetch-depth: 0
      - name: Configure target Git identity
        working-directory: superset-target
        run: |
          git config user.name "devin-remediation"
          git config user.email "devin-remediation@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run remediation pipeline
        env:
          ONLY_LANES: ${{ github.event.inputs.only_lanes || '' }}
          BUDGET_N: ${{ github.event.inputs.budget_n || '1' }}
          MAX_SESSIONS: ${{ github.event.inputs.max_sessions || '1' }}
          TIER_HIGH_MIN: ${{ github.event.inputs.tier_high_min || '' }}
        run: |
          args=(
            --mode=live
            --repo-path "$GITHUB_WORKSPACE/superset-target"
            --output-dir "$GITHUB_WORKSPACE/remediation-output"
            --baseline fixtures/baseline.json
            --budget-N "$BUDGET_N"
            --max-sessions "$MAX_SESSIONS"
            --head-branch "devin/remediation-${{ github.run_id }}"
          )
          if [[ -n "$ONLY_LANES" ]]; then
            args+=(--only-lanes "$ONLY_LANES")
          fi
          if [[ -n "$TIER_HIGH_MIN" ]]; then
            args+=(--tier-high-min "$TIER_HIGH_MIN")
          fi
          python -m pipeline "${args[@]}"
      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-${{ github.run_id }}
          path: remediation-output
      - name: Publish remediation run history
        if: always()
        continue-on-error: true
        run: |
          state_file="$(find remediation-output/state -maxdepth 1 -type f -name '*.jsonl' -print -quit 2>/dev/null || true)"
          if [[ -z "$state_file" ]]; then
            echo "No remediation state JSONL found; skipping run-history publication."
            exit 0
          fi

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          run_dir="history/${timestamp}-${{ github.run_id }}"
          mkdir -p "$run_dir/state" "$run_dir/reports"
          cp "$state_file" "$run_dir/state/$(basename "$state_file")"
          if [[ -f remediation-output/reports/events.jsonl ]]; then
            cp remediation-output/reports/events.jsonl "$run_dir/reports/events.jsonl"
          fi

          result_args=()
          while IFS= read -r history_dir; do
            result_args+=(--run-dir "$history_dir")
          done < <(find history -mindepth 1 -maxdepth 1 -type d -print | sort)
          python -m pipeline.observability.results \
            "${result_args[@]}" \
            --baseline fixtures/baseline.json \
            --out RESULTS.md

          git config user.name "devin-remediation"
          git config user.email "devin-remediation@users.noreply.github.com"
          git add history RESULTS.md
          if git diff --cached --quiet; then
            echo "No remediation history or RESULTS.md changes to commit."
            exit 0
          fi
          git commit -m "chore(observability): record run ${{ github.run_id }} and refresh RESULTS.md"
          git remote set-url --push origin "https://x-access-token:${GITHUB_PAT_REMEDIATION}@github.com/${{ github.repository }}.git"

          for attempt in 1 2 3; do
            if ! git fetch origin main; then
              sleep 5
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to publish remediation run history after 3 attempts."
          exit 0
