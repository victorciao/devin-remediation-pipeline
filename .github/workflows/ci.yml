name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Superset baseline
        uses: actions/checkout@v4
        with:
          repository: victorciao/superset
          ref: a140e74f5f54b2ada25e7558d884812facd3375d
          path: superset
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy --strict src tests
      - name: Pytest with coverage gate
        env:
          SUPERSET_CHECKOUT: ${{ github.workspace }}/superset
        run: pytest --cov --cov-report=term-missing
